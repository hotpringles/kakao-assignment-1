<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- 앱 헤더 -->
      <header class="app-header">
        <h1 class="app-title">Todo</h1>
        <p class="app-subtitle">오늘 할 일을 정리해보세요</p>
      </header>

      <!-- Todo 입력 영역 -->
      <section class="input-section">
        <div class="input-wrapper">
          <input
            type="text"
            id="todoInput"
            class="todo-input"
            placeholder="새로운 할 일을 입력하세요"
            maxlength="100"
            autocomplete="off"
          />
          <button id="addBtn" class="add-btn" aria-label="할 일 추가">+</button>
        </div>
        <!-- 유효성 검사 안내 메시지 -->
        <p
          id="errorMessage"
          class="error-message"
          role="alert"
          aria-live="polite"
        ></p>
      </section>

      <!-- Todo 통계 -->
      <section class="stats-section" id="statsSection">
        <span id="totalCount" class="stat-item">전체 <strong>0</strong></span>
        <span class="stat-divider">·</span>
        <span id="doneCount" class="stat-item">완료 <strong>0</strong></span>
        <span class="stat-divider">·</span>
        <span id="remainCount" class="stat-item"
          >남은 일 <strong>0</strong></span
        >
      </section>

      <!-- Todo 목록 -->
      <ul
        id="todoList"
        class="todo-list"
        role="list"
        aria-label="할 일 목록"
      ></ul>

      <!-- 빈 상태 메시지 -->
      <div id="emptyState" class="empty-state">
        <p>아직 할 일이 없어요</p>
        <p class="empty-hint">위 입력창에서 추가해보세요</p>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
